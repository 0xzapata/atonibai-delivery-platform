services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaonpw}
      POSTGRES_DB: ${POSTGRES_DB:-kaoncdo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kaon}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kaon}:${POSTGRES_PASSWORD:-kaonpw}@db:5432/${POSTGRES_DB:-kaoncdo}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata: {}
